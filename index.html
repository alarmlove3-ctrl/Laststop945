<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAST STOP · Carriage 7</title>
<style>
:root{color-scheme:dark;--bg:#050507;--panel:#0e0e14;--line:#22222c;--tx:#e9e6ee;--mut:#857f92;--red:#c1121f;--teal:#2ec4b6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#000;color:var(--tx);font-family:"Helvetica Neue",Arial,sans-serif}
body{display:flex;justify-content:center;align-items:center;overflow:hidden}
#phone{position:relative;width:100%;max-width:430px;height:100%;max-height:860px;background:radial-gradient(ellipse at 50% -10%,#2a0710 0,var(--bg) 62%);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);transition:filter .6s}
#phone::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);box-shadow:inset 0 0 140px #000;animation:fk 7s infinite}
#phone.dark{filter:brightness(.5) contrast(1.2) saturate(1.4)}
#phone.dark::before{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(circle,transparent 30%,rgba(193,18,31,.55));animation:hb 1.1s infinite}
@keyframes hb{0%,100%{opacity:.25}15%{opacity:1}30%{opacity:.3}45%{opacity:.9}}
@keyframes fk{0%,92%,100%{opacity:1}93%{opacity:.82}94%{opacity:1}96%{opacity:.7}97%{opacity:1}}
.glitch{animation:gl .8s steps(2,end)}
@keyframes gl{0%{transform:translate(0)}15%{transform:translate(-8px,2px) skewX(8deg);filter:hue-rotate(90deg) saturate(3)}30%{transform:translate(9px,-3px);filter:invert(1)}45%{transform:translate(-4px,5px) skewX(-10deg);filter:hue-rotate(200deg)}60%{transform:translate(5px,0);clip-path:inset(15% 0 45% 0)}80%{transform:translate(-2px,1px);clip-path:none}100%{transform:none;filter:none}}
.screen{flex:1;display:none;flex-direction:column;min-height:0}.screen.on{display:flex}
h1{font-family:Georgia,serif;letter-spacing:.35em;font-weight:400;text-align:center;margin:26px 0 4px;font-size:32px;color:var(--red);text-shadow:0 0 18px rgba(193,18,31,.7),2px 0 #2ec4b655,-2px 0 #ff000055;animation:fk 3.5s infinite}
.sub{text-align:center;color:var(--mut);font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px}
.note{text-align:center;color:#ff8a92;font-size:12px;margin-bottom:14px}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px;overflow:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;color:var(--tx);cursor:pointer;font:inherit}
.card:hover,.card:focus-visible{border-color:var(--red);box-shadow:0 0 14px rgba(193,18,31,.4);outline:none}
.card b{display:block;font-size:17px}.card small{color:var(--mut);font-size:11px}
.av{width:60px;height:60px;border-radius:50%;background-size:cover;background-position:center;margin-bottom:8px;border:2px solid var(--red)}
#bar{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-size:11px;color:var(--mut);border-bottom:1px solid var(--line)}
.btn{background:none;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:6px 9px;font:inherit;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--red)}
#tabs{display:flex;gap:6px;padding:8px 12px}
.tab{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--mut);font:inherit;font-size:13px;cursor:pointer}
.tab.on{color:var(--tx);border-color:var(--red);background:rgba(193,18,31,.14)}
#msgs{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:7px;min-height:0}
.row{display:flex;gap:7px;align-items:flex-end;animation:pop .25s ease-out}.row.me{justify-content:flex-end}.row.sys{justify-content:center}
.pf{width:30px;height:30px;border-radius:50%;flex:none;background-size:cover;background-position:center;display:grid;place-items:center;font-size:12px;font-weight:700;color:#07070a}
.m{max-width:76%;padding:8px 12px;border-radius:16px;background:var(--panel);border:1px solid var(--line);font-size:14.5px;line-height:1.35;overflow-wrap:anywhere}
.m .n{display:block;font-size:11px;font-weight:700;margin-bottom:2px}
.me .m{background:#14303a;border-color:#1f4a55}
.sys .m{background:none;border:none;color:var(--mut);font-size:12px;text-align:center;font-style:italic;max-width:92%}
.con .m{background:#1b0508;border-color:var(--red);font-family:"Courier New",monospace;color:#ff8a92;text-shadow:0 0 6px rgba(255,0,0,.5)}
.x .m{background:#0a0a0a;border:1px dashed #666;color:#bcd;animation:gl 2.5s infinite steps(3)}
.typing{align-self:flex-start;color:var(--mut);font-size:12px;padding-left:37px}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
#choices{max-height:42vh;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-top:1px solid var(--line);min-height:52px;background:rgba(0,0,0,.5)}
.ch{background:var(--panel);border:1px solid var(--red);color:var(--tx);border-radius:12px;padding:10px 12px;text-align:left;font:inherit;font-size:14px;cursor:pointer}
.ch:hover{background:#2a0a10}
.hint{color:var(--mut);font-size:12px;text-align:center;padding:6px}
#ov{position:absolute;inset:0;background:rgba(3,3,5,.95);z-index:7;display:none;flex-direction:column;padding:20px;overflow:auto}
#ov.on{display:flex}
#ov h2{font-family:Georgia,serif;color:var(--red);margin:0 0 12px;font-weight:400;letter-spacing:.15em}
.clue{border-left:3px solid var(--red);padding:8px 12px;margin-bottom:10px;background:var(--panel);border-radius:0 10px 10px 0;font-size:14px}
input{background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:12px;font:inherit;font-size:20px;letter-spacing:.5em;text-align:center;width:100%;margin:12px 0}
.err{color:#ff8a92;font-size:13px;min-height:18px;text-align:center}
#fl{position:absolute;inset:0;z-index:9;background:#b00014;display:none;place-items:center;text-align:center;font-family:Georgia,serif;font-size:46px;color:#000;letter-spacing:.12em;padding:20px}
#fl.on{display:grid}
#choices input,#lc input{letter-spacing:0;font-size:15px;text-align:left;margin:0;flex:1;padding:10px}
.gr{display:flex;gap:6px}
.tm{height:4px;background:var(--red);border-radius:2px;transition:width .25s linear;box-shadow:0 0 8px var(--red)}
.haunt .m{border-color:var(--red);color:#ff8a92;animation:gl 3s infinite steps(3)}
.rv{width:170px;height:170px;border-radius:50%;background-size:cover;background-position:center;border:3px solid var(--red);margin:20px auto;box-shadow:0 0 40px rgba(193,18,31,.7);animation:gl 2.4s infinite steps(4)}
.pb{background:#000;border:1px solid var(--red);color:var(--tx);border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer}
#pv{width:100%;border:1px solid var(--line);transition:filter .8s;background:#000}
#pv.en{filter:brightness(6) contrast(1.8)}
</style></head>
<body>
<div id="phone">
 <div id="login" class="screen on">
  <h1>LAST STOP</h1><div class="sub">Carriage 7 · choose your passenger</div>
  <div class="note">🔊 Sound on. Headphones recommended. Lights off is better.</div>
  <div id="grid"></div>
  <button class="btn" id="rs" style="margin:0 16px 16px">💾 restore from a save code</button>
 </div>
 <div id="game" class="screen">
  <div id="bar"><span>📵 <span id="bt">🔋38%</span> · <span id="pc">👥 8</span></span><span><button class="btn" id="mt" aria-label="Sound">🔊</button> <button class="btn" id="cb">🔎 <span id="cc">0</span></button> <button class="btn" id="sw" aria-label="Switch passenger">⏏</button></span></div>
  <div id="tabs"></div>
  <div id="msgs" aria-live="polite"></div>
  <div id="lc" class="gr" style="display:none;padding:8px 12px;border-top:1px solid var(--line)"><input id="li" placeholder="message the group…" maxlength="300" autocomplete="off" aria-label="Lounge message"><button class="pb" id="ls">Send</button></div>
  <div id="choices"></div>
 </div>
 <div id="ov"></div><div id="fl"></div>
</div>
